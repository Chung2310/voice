name: CPU image and VPS deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=cpu-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate Compose and deployment script
        run: |
          bash -n docker/deploy.sh
          docker compose --env-file .env.example -f docker/docker-compose.prod.yml --profile web --profile api config --quiet
          docker compose --env-file .env.example -f docker/docker-compose.build.yml config --quiet
          docker compose --env-file .env.example -f docker/docker-compose.yml --profile cpu --profile api-cpu config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: prod
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
      - name: Smoke test imports and bundled samples
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c "import os, pathlib, gradio, onnxruntime, soundfile, sea_g2p, apps.openai_speech; assert os.getuid() != 0; assert list(pathlib.Path('examples/audio_ref').glob('*.wav')); p=pathlib.Path(os.environ['HF_HOME'])/'write-test'; p.write_text('ok'); p.unlink()"
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: vieneu-vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from GitHub Variable
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
        shell: bash
        run: |
          if [[ -z "${ENV_FILE//[[:space:]]/}" ]]; then
            echo 'Set GitHub Actions Variable ENV_FILE to the complete .env content.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$ENV_FILE" > .env
          docker compose --env-file .env -f docker/docker-compose.prod.yml config --quiet
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy and wait for health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          IMAGE_NAME: ${{ needs.image.outputs.image }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        shell: bash
        run: |
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$SSH_PORT")
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir -p ~/vieneu-tts/releases/$release"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$SSH_PORT" docker/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:vieneu-tts/releases/$release/compose.yml"
          scp -p -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$SSH_PORT" .env "$SSH_USER@$SSH_HOST:vieneu-tts/releases/$release/.env"
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$release' '$IMAGE_NAME' '$IMAGE_TAG'" < docker/deploy.sh
      - name: Remove runner deployment credentials
        if: always()
        run: rm -f .env ~/.ssh/id_ed25519 ~/.ssh/known_hosts
